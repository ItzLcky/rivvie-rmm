# rivvie-rmm for Arcane (or any Docker Compose host).
# Paste this as the project's compose file and deploy/arcane/.env.example as its .env.
#
# The server speaks plain HTTP on port 8080. Put it behind your HTTPS reverse proxy
# (it must pass WebSocket upgrades for /api/agent/ws and /api/agents/*/shell).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rmm
    volumes:
      - rmm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s
      retries: 10

  server:
    image: ghcr.io/itzlcky/rivvie-rmm:${RMM_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rmm:${POSTGRES_PASSWORD}@db/rmm
      RMM_PUBLIC_URL: ${RMM_PUBLIC_URL:?set RMM_PUBLIC_URL}
      RMM_ADMIN_EMAIL: ${RMM_ADMIN_EMAIL:-}
      RMM_ADMIN_PASSWORD: ${RMM_ADMIN_PASSWORD:-}
      # Your reverse proxy's address (or `private` if it's on the same host/Docker network),
      # so rate limiting sees real client IPs instead of the proxy's.
      RMM_TRUSTED_PROXIES: ${RMM_TRUSTED_PROXIES:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${RMM_PORT:-8080}:8080"

  # Nightly pg_dump (custom format), pruned after BACKUP_KEEP_DAYS. Dumps hold password
  # hashes, 2FA secrets and agent credential hashes, so they're written mode 0600.
  # Copy the rmm-backups volume somewhere off this host; a backup on the same disk isn't a backup.
  # Restore: see "Backups" in the README.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: rmm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rmm
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - rmm-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          f=/backups/rmm-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.part"; then
            mv "$$f.part" "$$f" && echo "backup: wrote $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.part"; echo "backup: pg_dump failed" >&2
          fi
          find /backups -name 'rmm-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done

volumes:
  rmm-pgdata:
  rmm-backups:
