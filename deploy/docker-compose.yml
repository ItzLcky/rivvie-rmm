# Production-ish stack: Postgres + rmm-server + Caddy (automatic HTTPS).
# Usage:  cp deploy/.env.example deploy/.env  (edit it), then
#         docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: rmm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s

  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://rmm:${POSTGRES_PASSWORD}@db/rmm
      RMM_PUBLIC_URL: https://${RMM_DOMAIN:?set RMM_DOMAIN in deploy/.env}
      RUST_LOG: info

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      RMM_DOMAIN: ${RMM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  caddy:
