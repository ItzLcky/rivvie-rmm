# Production-ish stack: Postgres + rmm-server + Caddy (automatic HTTPS).
# Usage:  cp deploy/.env.example deploy/.env  (edit it), then
#         docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: rmm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s

  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://rmm:${POSTGRES_PASSWORD}@db/rmm
      RMM_PUBLIC_URL: https://${RMM_DOMAIN:?set RMM_DOMAIN in deploy/.env}
      # Encrypts 2FA secrets and detection context at rest. Keep a copy outside this host.
      RMM_DATA_KEY: ${RMM_DATA_KEY:?set RMM_DATA_KEY in deploy/.env (openssl rand -hex 32)}
      # Caddy reaches the server over the compose network; believe its X-Forwarded-For.
      RMM_TRUSTED_PROXIES: private
      RUST_LOG: info
      # Prometheus metrics at /metrics for scrapers sending "Authorization: Bearer <token>"
      # (off, answering 404, unless set). See "Monitoring the server" in the README.
      # RMM_METRICS_TOKEN: ${RMM_METRICS_TOKEN}
      # One JSON object per log line instead of text, for log shippers.
      # RMM_LOG_FORMAT: json
      # Largest ticket or portal attachment, per file (default 100).
      # RMM_ATTACHMENT_MAX_MB: 100
    # Ticket attachments, raw email, invoice PDFs, triage packages. The backup service archives it.
    volumes: [files:/srv/data]

  # Nightly backup: a pg_dump (custom format) and a tarball of the local object storage (ticket
  # attachments, raw email, invoice PDFs, triage packages) with the same timestamp, pruned after
  # BACKUP_KEEP_DAYS. See backup.sh. The dumps hold password hashes, 2FA secrets (encrypted with
  # RMM_DATA_KEY) and agent credential hashes, so the files are written mode 0600.
  # Copy deploy/backups/ somewhere off this host; a backup on the same disk isn't a backup.
  # With RMM_S3_BUCKET the tarball is empty: turn on versioning on the bucket (see "Backups" in
  # the README). Restore: restore.sh, below.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: rmm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rmm
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backups:/backups
      - files:/srv/data:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sh /backup.sh || echo "backup: failed" >&2
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done

  # Not started with the stack. Restores a backup into the database and the files volume, with the
  # server stopped:  docker compose --profile restore run --rm restore rmm-20260101T030000Z
  # (or `latest`). See "Backups" in the README.
  restore:
    profiles: [restore]
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: rmm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rmm
      RESTORE_REPLACE_STORAGE: ${RESTORE_REPLACE_STORAGE:-}
    volumes:
      - ./backups:/backups:ro
      - files:/srv/data
      - ./restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "/restore.sh"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      RMM_DOMAIN: ${RMM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  caddy:
  files:
