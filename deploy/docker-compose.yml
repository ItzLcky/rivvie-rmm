# Production-ish stack: Postgres + rmm-server + Caddy (automatic HTTPS).
# Usage:  cp deploy/.env.example deploy/.env  (edit it), then
#         docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: rmm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s

  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://rmm:${POSTGRES_PASSWORD}@db/rmm
      RMM_PUBLIC_URL: https://${RMM_DOMAIN:?set RMM_DOMAIN in deploy/.env}
      # Encrypts 2FA secrets and detection context at rest. Keep a copy outside this host.
      RMM_DATA_KEY: ${RMM_DATA_KEY:?set RMM_DATA_KEY in deploy/.env (openssl rand -hex 32)}
      # Caddy reaches the server over the compose network; believe its X-Forwarded-For.
      RMM_TRUSTED_PROXIES: private
      RUST_LOG: info
    # Ticket attachments and raw email. Back this up along with the database dumps.
    volumes: [files:/srv/data]

  # Nightly pg_dump (custom format), pruned after BACKUP_KEEP_DAYS. Dumps hold password
  # hashes, 2FA secrets (encrypted with RMM_DATA_KEY) and agent credential hashes, so they're written mode 0600.
  # Copy deploy/backups/ somewhere off this host; a backup on the same disk isn't a backup.
  # Restore: see "Backups" in the README.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: rmm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: rmm
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          f=/backups/rmm-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.part"; then
            mv "$$f.part" "$$f" && echo "backup: wrote $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.part"; echo "backup: pg_dump failed" >&2
          fi
          find /backups -name 'rmm-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      RMM_DOMAIN: ${RMM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  pgdata:
  caddy:
  files:
