name: Server image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, for the agent version below
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v1.2.3 tag builds agents reporting 1.2.3. Other builds report the next patch after
      # the newest tag as a pre-release numbered by the run (v1.2.3 -> 1.2.4-dev.57), so each
      # build is newer than the last and agents with automatic updates move to it. A later
      # v1.2.4 tag is newer still.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "agent=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            base="${base#v}"
            [ -n "$base" ] || base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
            base="${base%%[-+]*}"
            IFS=. read -r major minor patch <<< "$base"
            echo "agent=${major}.${minor:-0}.$(( ${patch:-0} + 1 ))-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Self-update signing (optional): the repository variable RMM_UPDATE_PUBKEY and the
          # secret RMM_UPDATE_SIGNING_KEY, both from `rmm-sign keygen`. The key never reaches
          # the image; only the signatures do.
          build-args: |
            RMM_UPDATE_PUBKEY=${{ vars.RMM_UPDATE_PUBKEY }}
            RMM_AGENT_VERSION=${{ steps.version.outputs.agent }}
          secrets: |
            update_key=${{ secrets.RMM_UPDATE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
