name: Server image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v1.2.3 tag builds agents reporting 1.2.3; other builds keep the crate version.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "agent=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Self-update signing (optional): the repository variable RMM_UPDATE_PUBKEY and the
          # secret RMM_UPDATE_SIGNING_KEY, both from `rmm-sign keygen`. The key never reaches
          # the image; only the signatures do.
          build-args: |
            RMM_UPDATE_PUBKEY=${{ vars.RMM_UPDATE_PUBKEY }}
            RMM_AGENT_VERSION=${{ steps.version.outputs.agent }}
          secrets: |
            update_key=${{ secrets.RMM_UPDATE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
