name: Server image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # Only this job pushes to GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A v1.2.3 tag builds agents reporting 1.2.3; other builds keep the crate version.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "agent=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Self-update signing (optional): the repository variable RMM_UPDATE_PUBKEY and the
          # secret RMM_UPDATE_SIGNING_KEY, both from `rmm-sign keygen`. The key never reaches
          # the image; only the signatures do.
          build-args: |
            RMM_UPDATE_PUBKEY=${{ vars.RMM_UPDATE_PUBKEY }}
            RMM_AGENT_VERSION=${{ steps.version.outputs.agent }}
          secrets: |
            update_key=${{ secrets.RMM_UPDATE_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
