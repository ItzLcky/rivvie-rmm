name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (agent + proto + sign + scan engine + content)
        run: cargo clippy -p rmm-agent -p rmm-proto -p rmm-sign -p rmm-scan -p rmm-content --all-targets -- -D warnings
      - name: Clippy (scan engine and agent without YARA)
        run: cargo clippy -p rmm-scan -p rmm-agent --no-default-features --all-targets -- -D warnings
      - name: Test (agent + proto + sign + scan engine + content)
        run: cargo test -p rmm-agent -p rmm-proto -p rmm-sign -p rmm-scan -p rmm-content
      - name: Server and load generator (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy -p rmm-server -p rmm-loadgen --all-targets -- -D warnings && cargo test -p rmm-server -p rmm-loadgen
      - name: Release agent
        run: cargo build --release -p rmm-agent
      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-${{ runner.os }}
          path: |
            target/release/rmm-agent
            target/release/rmm-agent.exe

  # On-access protection (fanotify) as root: a denied exec, an allowed one, a written file
  # quarantined, the deadline path, audit mode, a stopped and killed sensor releasing what it
  # held, restarts. See crates/rmm-agent/tests/onaccess.rs (locally: scripts/test-onaccess.sh).
  onaccess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test as the runner user
        id: build
        run: |
          bin=$(cargo test -p rmm-agent --test onaccess --no-run --message-format=json \
                | jq -r 'select(.reason == "compiler-artifact" and .target.name == "onaccess" and .executable != null) | .executable')
          test -x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: On-access tests (root)
        run: sudo "${{ steps.build.outputs.bin }}" --ignored --test-threads=1 --nocapture

  # The real server against Postgres, with real agent processes: enrollment reuse/takeover,
  # jobs across server restarts, lost/expired jobs, headers, per-client access, packages,
  # rate limits. See crates/rmm-server/tests/e2e.rs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: rmm, POSTGRES_PASSWORD: rmm, POSTGRES_DB: rmm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmm" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package tools (to validate the generated .deb/.rpm)
        run: sudo apt-get install -y --no-install-recommends rpm restic
      # Prometheus's own parser and linter, for the /metrics output.
      - name: promtool
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | tar xz -C /tmp --strip-components=1 prometheus-3.5.0.linux-amd64/promtool
          /tmp/promtool --version
      - run: cargo build -p rmm-agent
      - name: End-to-end
        run: cargo test -p rmm-server --test e2e -- --ignored --nocapture
        env:
          RMM_E2E_DATABASE_URL: postgres://rmm:rmm@localhost:5432/postgres
          RMM_E2E_PROMTOOL: /tmp/promtool
      - name: Stored search and health against the old expressions
        run: cargo test -p rmm-server --bin rmm-server stored_columns -- --ignored --nocapture
        env:
          RMM_E2E_DATABASE_URL: postgres://rmm:rmm@localhost:5432/postgres
      # Keeps the load generator working: 200 simulated agents for a minute, with dashboards,
      # page requests and bulk jobs; --check fails on any refused connection, dropped session or
      # API error. The full runs (docs/research/load-test-2026-11.md) are manual.
      - name: Load generator smoke run
        run: |
          cargo build -p rmm-server -p rmm-loadgen
          mkdir -p /tmp/load/web && echo '<!doctype html><title>smoke</title>' > /tmp/load/web/200.html
          PGPASSWORD=rmm psql -h localhost -U rmm -d postgres -c 'CREATE DATABASE rmm_load'
          DATABASE_URL=postgres://rmm:rmm@localhost:5432/rmm_load RMM_BIND=127.0.0.1:18080 RMM_PUBLIC_URL=http://127.0.0.1:18080 \
            RMM_WEB_DIR=/tmp/load/web RMM_AGENT_DIR=/tmp/load RMM_STORAGE_DIR=/tmp/load/storage RMM_METRICS_TOKEN=smoke-token \
            RMM_ADMIN_EMAIL=load@example.test RMM_ADMIN_PASSWORD=load-test-password target/debug/rmm-server > /tmp/load/server.log 2>&1 &
          for i in $(seq 60); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 1; done
          target/debug/rmm-loadgen --server http://127.0.0.1:18080 --admin-email load@example.test --admin-password load-test-password \
            --agents 200 --ramp 50 --duration 60 --bulk-every 20 --bulk-size 50 --sse 3 --api-rps 3 --sample-secs 10 \
            --metrics-token smoke-token --database-url postgres://rmm:rmm@localhost:5432/rmm_load \
            --state /tmp/load/state.json --out /tmp/load/smoke.json --check > /tmp/load/loadgen.log 2>&1 \
            || { tail -n 60 /tmp/load/loadgen.log; exit 1; }
          grep -E '^(ramp|check)' /tmp/load/loadgen.log
      - name: Server and agent logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/rmm_e2e_*/*.log
            /tmp/load/*.log

  # A backup nobody has restored is a hope. Runs the e2e suite, backs its database and storage up
  # with the compose stack's own deploy/backup.sh (a pg_dump and a tarball of the attachments,
  # invoice PDFs, triage packages), restores them with deploy/restore.sh into a new database and an
  # empty directory, starts the server on them and reads the rows back, an attachment's bytes by hash
  # among them (crates/rmm-server/tests/drill.rs). Locally: scripts/restore-drill.sh.
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: rmm, POSTGRES_PASSWORD: rmm, POSTGRES_DB: rmm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmm" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package tools (to validate the generated .deb/.rpm)
        run: sudo apt-get install -y --no-install-recommends rpm restic
      - run: cargo build -p rmm-agent
      - name: Restore drill
        run: scripts/restore-drill.sh
        env:
          RMM_E2E_DATABASE_URL: postgres://rmm:rmm@localhost:5432/postgres
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-logs
          path: |
            /tmp/rmm-drill.*/*.log
            /tmp/rmm_e2e_*/*.log

  # The S3 storage code (SigV4, multipart uploads around the part boundaries, ranged reads, aborted
  # uploads) against a real MinIO. A step, not a service container: it needs `server /data`.
  # The image is pinned: MinIO stopped publishing to Docker Hub, and this is the last tag of a
  # community rebuild. Locally: scripts/minio-test.sh.
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for i in $(seq 60); do curl -fs http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:9000/minio/health/ready
      - name: S3 storage against MinIO
        run: cargo test -p rmm-server s3_against_minio -- --ignored --nocapture
        env:
          RMM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      - name: MinIO log
        if: failure()
        run: docker logs minio

  # An upgrade keeps data: the previous release (the newest v* tag, from its GHCR image) makes a
  # database with real rows in it (admin, client and site, its own agent enrolled with metrics
  # and inventory, a ticket; see crates/rmm-server/tests/upgrade.rs), then this commit's server
  # migrates a copy of it and the whole e2e suite runs there, after reading those rows back.
  # A shipped migration that was edited fails twice: the diff step names the file, and sqlx's
  # checksums stop the new server on the old database.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: rmm, POSTGRES_PASSWORD: rmm, POSTGRES_DB: rmm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmm" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PREV_DB_URL: postgres://rmm:rmm@localhost:5432/rmm_prev
      PREV_URL: http://127.0.0.1:18090
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Previous release
        id: prev
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${tag#v}" >> "$GITHUB_OUTPUT"
          echo "previous release: $tag"
      - name: Shipped migrations are unchanged
        run: |
          shipped=$(git ls-tree --name-only "${{ steps.prev.outputs.tag }}" crates/rmm-server/migrations/)
          git diff --exit-code --stat "${{ steps.prev.outputs.tag }}" -- $shipped \
            || { echo "::error::a migration shipped in ${{ steps.prev.outputs.tag }} was edited; add a new one instead"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the previous release
        env:
          IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          docker pull "$IMAGE"
          mkdir -p /tmp/prev
          docker create --name prev-files "$IMAGE" && docker cp prev-files:/srv/agents/rmm-agent-linux-x86_64 /tmp/prev/rmm-agent && docker rm prev-files
          PGPASSWORD=rmm psql -h localhost -U rmm -d postgres -c 'CREATE DATABASE rmm_prev'
          docker run -d --name prev --network host -e DATABASE_URL="$PREV_DB_URL" -e RMM_BIND=127.0.0.1:18090 -e RMM_PUBLIC_URL="$PREV_URL" \
            -e RMM_ADMIN_EMAIL=admin@e2e.test -e RMM_ADMIN_PASSWORD=e2e-admin-password -e RMM_HEARTBEAT_SECS=5 \
            -e RMM_DATA_KEY=abababababababababababababababababababababababababababababababab "$IMAGE"
          for i in $(seq 60); do curl -fs "$PREV_URL/healthz" && break; sleep 1; done
          curl -fs "$PREV_URL/healthz"
      - run: cargo build -p rmm-agent
      - name: Data through the previous release
        run: cargo test -p rmm-server --test upgrade -- --ignored --nocapture
        env:
          RMM_UPGRADE_URL: ${{ env.PREV_URL }}
          RMM_UPGRADE_AGENT_BIN: /tmp/prev/rmm-agent
          RMM_UPGRADE_EXPECT: /tmp/prev/expect.json
      - name: Stop it, and clear the admin's 2FA for the suite (with the old release's CLI)
        env:
          IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          docker logs prev > /tmp/prev/server.log 2>&1
          docker rm -f prev
          docker run --rm --network host -e DATABASE_URL="$PREV_DB_URL" "$IMAGE" reset2fa --email admin@e2e.test
          PGPASSWORD=rmm psql -h localhost -U rmm -d rmm_prev -Atc 'SELECT max(version) FROM _sqlx_migrations'
      - name: End-to-end on the upgraded database
        run: cargo test -p rmm-server --test e2e -- --ignored --nocapture
        env:
          RMM_E2E_DATABASE_URL: postgres://rmm:rmm@localhost:5432/postgres
          RMM_E2E_TEMPLATE: rmm_prev
          RMM_E2E_EXPECT: /tmp/prev/expect.json
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs
          path: |
            /tmp/prev/*.log
            /tmp/rmm_e2e_*/*.log

  # The agent installed from the generated MSI as a real Windows service: install, jobs
  # (PowerShell, cmd), Job Object tree kill, results across a service restart, services,
  # upgrade over itself, then ConPTY shells, Event Log watchers, a Windows Update scan,
  # Defender (with the EICAR file), the sensor, a signed self-update with a forced rollback,
  # and uninstall. See crates/rmm-server/tests/e2e_windows.rs (RMM_E2E_ONLY / RMM_E2E_SKIP pick
  # sections; the logs of a failed run are uploaded). The runner image ships PostgreSQL
  # (service disabled; user postgres, password root).
  #
  # On ab72ebc the tests passed and the job then hung in its post-job steps (rust-cache's save)
  # until GitHub killed it at the default limit; that run's log was never written, so what was
  # still running is unknown. Hence the timeouts, and a cleanup step that first lists what is
  # left (so the next hang says why) and then stops it before the post-job steps run.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $pg = Get-Service -Name postgresql*
          Set-Service -InputObject $pg -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe" -h localhost -t 60
      # The agent is built with the e2e's release key (the fixed test seed, "09" x 32), twice:
      # a newer one for the self-update to install, then the one the MSI installs.
      - name: Release key and agent builds
        shell: pwsh
        run: |
          cargo build -p rmm-sign
          New-Item -ItemType Directory -Force target | Out-Null
          Set-Content -NoNewline -Path target/e2e-release.key -Value ('09' * 32)
          $pub = (& target/debug/rmm-sign.exe pubkey --key target/e2e-release.key).Trim()
          $env:RMM_UPDATE_PUBKEY = $pub
          $env:RMM_AGENT_VERSION = '99.0.0'
          cargo build -p rmm-agent
          Copy-Item target/debug/rmm-agent.exe target/e2e-agent-new.exe
          Remove-Item Env:RMM_AGENT_VERSION
          cargo build -p rmm-agent
      - name: Build the end-to-end test
        run: cargo test -p rmm-server --test e2e_windows --no-run
        env:
          RMM_E2E_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres
          RMM_E2E_NEW_AGENT_BIN: ${{ github.workspace }}/target/e2e-agent-new.exe
      # The runner image excludes whole drives from Defender, so the test skips the EICAR
      # detection check here (the manual plan in docs/design/windows-testing.md covers it).
      # Removing the exclusions stalled the runner for the whole job timeout.
      - name: End-to-end (Windows)
        timeout-minutes: 30
        run: cargo test -p rmm-server --test e2e_windows -- --ignored --nocapture
        env:
          RMM_E2E_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres
          RMM_E2E_NEW_AGENT_BIN: ${{ github.workspace }}/target/e2e-agent-new.exe
      - name: Stop what the test started
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ws = (Resolve-Path .).Path
          $left = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -match '^(rmm-server|rmm-agent|rmm-sensor|e2e_windows-.*|msiexec)\.exe$' -or
            ($_.ExecutablePath -and $_.ExecutablePath.StartsWith($ws)) -or
            ($_.CommandLine -and $_.CommandLine -like '*rmm-e2e-*')
          }
          "Processes left behind:"; $left | Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize -Wrap | Out-String -Width 300
          if (Get-Service RmmAgent -ErrorAction SilentlyContinue) {
            "The RmmAgent service is still installed"; sc.exe stop RmmAgent; sc.exe delete RmmAgent
          }
          $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-Service -Name postgresql* | Stop-Service -Force -ErrorAction SilentlyContinue
          "Handles still open under target/ (if any):"
          Get-Process | Where-Object { $_.Modules.FileName -like "$ws\target\*" } -ErrorAction SilentlyContinue | Format-Table Id, Name -AutoSize
      - name: Server, agent and msiexec logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-logs
          path: |
            ~/AppData/Local/Temp/rmm_e2e_*/*.log
            C:/ProgramData/RMM/logs/*.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Screenshots of every page and the /dev/ui gallery in light and dark, plus WCAG 2.2 AA
  # checks (axe), against a mocked API. Same image as `npm run test:visual:docker`, which is
  # how the baselines in web/tests/visual/__screenshots__ are made.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
        env:
          HOME: /root
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
