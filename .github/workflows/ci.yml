name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (agent + proto + sign)
        run: cargo clippy -p rmm-agent -p rmm-proto -p rmm-sign --all-targets -- -D warnings
      - name: Test (agent + proto + sign)
        run: cargo test -p rmm-agent -p rmm-proto -p rmm-sign
      - name: Server (Linux only)
        if: runner.os == 'Linux'
        run: cargo clippy -p rmm-server --all-targets -- -D warnings && cargo test -p rmm-server
      - name: Release agent
        run: cargo build --release -p rmm-agent
      - uses: actions/upload-artifact@v4
        with:
          name: rmm-agent-${{ runner.os }}
          path: |
            target/release/rmm-agent
            target/release/rmm-agent.exe

  # The real server against Postgres, with real agent processes: enrollment reuse/takeover,
  # jobs across server restarts, lost/expired jobs, headers, per-client access, packages,
  # rate limits. See crates/rmm-server/tests/e2e.rs.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: rmm, POSTGRES_PASSWORD: rmm, POSTGRES_DB: rmm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rmm" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package tools (to validate the generated .deb/.rpm)
        run: sudo apt-get install -y --no-install-recommends rpm
      - run: cargo build -p rmm-agent
      - name: End-to-end
        run: cargo test -p rmm-server --test e2e -- --ignored --nocapture
        env:
          RMM_E2E_DATABASE_URL: postgres://rmm:rmm@localhost:5432/postgres
      - name: Server and agent logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/rmm_e2e_*/*.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Screenshots of every page and the /dev/ui gallery in light and dark, plus WCAG 2.2 AA
  # checks (axe), against a mocked API. Same image as `npm run test:visual:docker`, which is
  # how the baselines in web/tests/visual/__screenshots__ are made.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual
        env:
          HOME: /root
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
