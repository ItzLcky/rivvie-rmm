<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Offline</title>
		<style>
			body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f6f7f7; color: #14211f; }
			@media (prefers-color-scheme: dark) { body { background: #0c1b21; color: #e6efed; } a { color: #5eead4; } }
			main { max-width: 22rem; padding: 1.5rem; text-align: center; }
			img { width: 3rem; height: 3rem; }
			a { color: #0f766e; }
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" />
			<h1>You’re offline</h1>
			<p>Alerts, tickets and time need a connection: nothing is kept on this device. Reconnect and <a href="/alerts">try again</a>.</p>
		</main>
	</body>
</html>
