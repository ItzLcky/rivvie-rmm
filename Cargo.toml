[workspace]
resolver = "3"
members = ["crates/rmm-proto", "crates/rmm-agent", "crates/rmm-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
rmm-proto = { path = "crates/rmm-proto" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.11"
hex = "0.4"
toml = "1"

[profile.release]
opt-level = "z"     # agent size matters more than raw speed
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
