[package]
name = "rmm-checks"
description = "Small network checks (ping, TCP, HTTP, TLS certificates, DNS) for RMM uptime monitoring"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmm-snmp = { path = "../rmm-snmp" }
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
# The same TLS stack the agent's socket uses; nothing new in the tree.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }

[dev-dependencies]
rcgen = "0.14"
