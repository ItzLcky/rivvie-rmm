[package]
name = "rmm-server"
description = "RMM control server: agent hub, REST API, and dashboard host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rmm-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.7", features = ["fs", "trace", "limit", "set-header"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "derive", "macros"] }
argon2 = "0.6"
getrandom = "0.4"
subtle = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
tar = { version = "0.4", default-features = false }
flate2 = "1"
rpm = { version = "0.30", default-features = false, features = ["payload", "gzip-compression"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
