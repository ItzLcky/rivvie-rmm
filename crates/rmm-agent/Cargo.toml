[package]
name = "rmm-agent"
description = "Lightweight cross-platform RMM endpoint agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rmm-agent"
path = "src/main.rs"

[dependencies]
rmm-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user"] }
portable-pty = "0.9"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "url"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_UpdateAgent", "Win32_System_Variant"] }
