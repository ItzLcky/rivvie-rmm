[package]
name = "rmm-agent"
description = "Lightweight cross-platform RMM endpoint agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rmm-agent"
path = "src/main.rs"

[features]
default = ["yara"]
# YARA rules in signature databases (about 1.5 MB of binary). Without it the sensor still
# matches the database's hash signatures and reports its YARA rules as unsupported.
yara = ["rmm-scan/yara"]

[dependencies]
rmm-proto.workspace = true
rmm-content.workspace = true
rmm-scan.workspace = true
rmm-snmp = { path = "../rmm-snmp" }
rmm-checks = { path = "../rmm-checks" }
anyhow.workspace = true
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
regex-lite = "0.1"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user"] }
portable-pty = "0.9"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "url"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Already in the tree for the socket; used directly for database downloads (src/fetch.rs).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
jpeg-encoder = { version = "0.7", features = ["simd"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["shm", "randr", "xtest"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_UpdateAgent", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_NetworkManagement_NetManagement", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }
